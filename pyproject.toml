[project]
name = "occupancy-field"
version = "0.1.0"
description = "A dimension-agnostic Python library for continuous probabilistic occupancy fields from range-sensor evidence."
requires-python = ">=3.10"
dependencies = ["numpy",]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["occupancy_field"]