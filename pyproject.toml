[project]
name = "beta-evidence-fields"
version = "0.1.0"
description = "A dimension-agnostic Python library for continuous probabilistic occupancy fields from range-sensor evidence."
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["beta_evidence_field"]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]


[tool.pixi.pypi-dependencies]
beta-evidence-fields = { path = ".", editable = true }


[tool.pixi.dependencies]
pytest = ">=9.2.0,<10"
pytest-cov = ">=7,<8"
matplotlib = ">=3.11.2,<4"
tqdm = ">=4.70.1,<5"
pyyaml = ">=6.0.3,<7"
platformdirs = ">=4.14.8,<5"


[tool.pixi.tasks]
tests    = "pytest"
coverage = "pytest tests --cov=beta_evidence_field --cov-report=term-missing --cov-report=xml"
data     = "python scripts/download_data.py"

[tool.coverage.run]
branch = true
source = ["beta_evidence_field"]


[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under   = 95
