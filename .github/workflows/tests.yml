name: Beta Field Unit Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true

      - name: Gaussian Kernel
        run: pixi run pytest tests/test_gaussian.py

      - name: Occupancy Query
        run: pixi run pytest tests/test_query.py

      - name: Occupancy Prior
        run: pixi run pytest tests/test_prior.py

      - name: Occupancy Observation
        run: pixi run pytest tests/test_observation.py

      - name: Occupancy Field
        run: pixi run pytest tests/test_field.py